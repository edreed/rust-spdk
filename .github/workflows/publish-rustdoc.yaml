name: Publish RustDoc
on:
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        id: rustup
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.100.0

      - name: Generate Public RustDoc
        id: rustdoc
        run: cargo doc --no-deps --all-features --package spdk

      - name: Upload RustDoc Artifacts
        id: deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
