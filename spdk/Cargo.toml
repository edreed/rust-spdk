[package]
name = "spdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aquamarine = "0.6.0"
futures = "0.3.34"
libc = "0.2.191"
lazy-regex = "3.6.2"
serde = { version = "1.0.229", features = ["derive"] }
spdk-macros = { version = "0.1.0", path = "../spdk-macros" }
spdk-sys = { version = "0.1.0", path = "../spdk-sys" }
static_init = "1.0.4"
ternary-rs = "1.0.0"
libanl = { version = "0.1.0", path = "../libanl" }
thiserror = "2.0.21"
static_assertions = "1.1.0"
bitflags = "2.13.2"
lock_api = "0.5.0"
event-listener = "5.4.2"
document-features = "0.2.12"

[dev-dependencies]
laboratory = "2.0.0"
itertools = "0.15.0"
async-fs = "2.2.0"
comfy-table = "8.0.1"

[features]
default = []

## Enables basic block device (BDev) support.
bdev = ["spdk-sys/bdev"]

## Enables support for the Linux AIO BDev.
bdev-aio = ["bdev", "spdk-sys/bdev-aio"]

## Enables support for the Malloc BDev.
bdev-malloc = ["bdev", "spdk-sys/bdev-malloc"]

## Enables support for writing custom BDev modules.
bdev-module = ["bdev", "spdk-macros/bdev-module", "spdk-sys/bdev-module"]

## Enables support for the Uring BDev.
bdev-uring = ["bdev", "spdk-sys/bdev-uring"]

## Enables support for JSON serialization and deserialization through the SPDK.
json = ["spdk-sys/json"]

## Enables writing JSON-RPC functions.
json-rpc = ["json", "spdk-macros/json-rpc", "spdk-sys/json-rpc"]

## Enables SPDK-based network socket support.
net = ["spdk-sys/net"]

## Enables NVMe.
nvme = ["spdk-sys/nvme"]

## Enables the `vfio-user` transport for the NVMe-oF target.
nvme-vfio-user = ["nvme", "spdk-sys/nvme-vfio-user"]

## Enables the NVMe-oF target.
nvmf = ["bdev", "net", "nvme", "spdk-sys/nvmf"]

## Enables SCSI.
scsi = ["spdk-sys/scsi"]

## Enables the ublk target.
ublk = ["spdk-sys/ublk"]

[[example]]
name = "bdev_aio"
required-features = ["bdev-aio"]

[[example]]
name = "bdev_hello_world"
required-features = ["bdev-malloc"]

[[example]]
name = "bdev_uring"
required-features = ["bdev-uring"]

[[example]]
name = "jsonrpc"
required-features = ["json-rpc"]

[[example]]
name = "module_echo"
required-features = ["bdev-module"]

[[example]]
name = "module_null"
required-features = ["bdev-module"]

[[example]]
name = "module_passthru"
required-features = ["bdev-malloc", "bdev-module"]

[[example]]
name = "net_group"
required-features = ["net"]

[[example]]
name = "net_hello_world"
required-features = ["net"]

[[example]]
name = "net_resolve"
required-features = ["net"]

[[example]]
name = "nvmf"
required-features = ["bdev-malloc", "nvmf"]
