[package]
name = "spdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"

[package.metadata.docs.rs]
all-features = true

[dependencies]
aquamarine = "0.6.0"
futures = "0.3.33"
libc = "0.2.189"
lazy-regex = "3.6.1"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
spdk-macros = { version = "0.1.0", path = "../spdk-macros" }
spdk-sys = { version = "0.1.0", path = "../spdk-sys" }
static_init = "1.0.4"
ternary-rs = "1.0.0"
libanl = { version = "0.1.0", path = "../libanl" }

[dev-dependencies]
async-condvar-fair = { version = "1.0.1", features = ["parking_lot_0_12"] }
laboratory = "2.0.0"
parking_lot = { version = "0.12.5", features = ["send_guard"] }
itertools = "0.15.0"

[features]
default = []
bdev = ["spdk-sys/bdev"]
bdev-malloc = ["bdev", "spdk-sys/bdev-malloc"]
bdev-module = ["bdev", "spdk-macros/bdev-module", "spdk-sys/bdev-module"]
json = ["spdk-sys/json"]
net = ["spdk-sys/net"]
nvmf = ["bdev","spdk-sys/nvmf"]

[[example]]
name = "bdev_hello_world"
required-features = ["bdev-malloc"]

[[example]]
name = "module_echo"
required-features = ["bdev-module"]

[[example]]
name = "module_null"
required-features = ["bdev-module"]

[[example]]
name = "module_passthru"
required-features = ["bdev-malloc", "bdev-module"]

[[example]]
name = "net_group"
required-features = ["net"]

[[example]]
name = "net_hello_world"
required-features = ["net"]

[[example]]
name = "net_resolve"
required-features = ["net"]

[[example]]
name = "nvmf"
required-features = ["bdev-malloc", "nvmf"]
