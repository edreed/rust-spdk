[package]
name = "spdk-sys"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
links = "spdk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
autotools = "0.2.7"
bindgen = { version = "0.72.1", features = ["experimental"] }
cc = "1.4.4"
doxygen-rs = "0.4.2"
fs_extra = "1.3.0"
itertools = "0.15.0"
lazy-regex = "3.6.1"
pkg-config = "0.3.34"
ternary-rs = "1.0.0"

[features]
default = ["base"]
base = []
bdev = ["base"]
bdev-malloc = ["base", "bdev"]
bdev-module = ["base", "bdev"]
json = ["base"]
net = ["base"]
nvme = ["base", "bdev"]
nvme-vfio-user = ["base", "nvme"]
nvmf = ["base", "bdev"]
scsi = ["base", "bdev"]

[dependencies]
bitfields = "3.1.0"
